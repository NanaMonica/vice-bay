<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Vice Bay — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1520; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f2f5f8; display: none; }
  .panel { background: rgba(10, 14, 22, 0.72); border-radius: 10px; padding: 10px 16px; }
  #hud-top { position: absolute; top: 12px; left: 12px; min-width: 380px; }
  #hud-cash { font-size: 30px; font-weight: 800; color: #37d67a; line-height: 1.1; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
  #hud-mission { font-size: 15px; font-weight: 600; margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
  #hud-rank { font-size: 13px; font-weight: 600; margin-top: 4px; color: #ffd23f; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
  #hud-timer { font-size: 14px; margin-top: 2px; color: #9aa5b5; }
  #wanted { position: absolute; top: 12px; right: 16px; text-align: right; }
  #wanted-stars { font-size: 30px; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
  #wanted-label { font-size: 14px; font-weight: 600; }
  #health-wrap { position: absolute; top: 128px; left: 12px; width: 180px; height: 16px; background: rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #37d67a; border-radius: 8px; }
  #health-label { position: absolute; top: 128px; left: 200px; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
  #minimap { position: absolute; left: 12px; bottom: 12px; border: 2px solid rgba(242,245,248,0.5); border-radius: 8px; background: #16351f; }
  #speed { position: absolute; right: 20px; bottom: 56px; font-size: 28px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.7); }
  #hint { position: absolute; right: 20px; bottom: 28px; font-size: 13px; color: #d7dee8; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  #toast { position: absolute; top: 118px; left: 50%; transform: translateX(-50%); background: rgba(12, 18, 28, 0.88); border-radius: 10px; padding: 10px 22px; font-size: 17px; font-weight: 600; display: none; white-space: nowrap; }
  #panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none; }
  #panel-box { background: rgba(12, 18, 28, 0.88); border-radius: 14px; padding: 36px 48px 30px; text-align: center; max-width: 640px; }
  #panel-title { font-size: 52px; font-weight: 800; color: #f2f5f8; margin: 0 0 14px; letter-spacing: 2px; }
  #panel-lines p { margin: 4px 0; font-size: 20px; color: #9aa5b5; }
  #panel-prompt { margin: 22px 0 0; font-size: 22px; font-weight: 700; color: #37d67a; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vice Bay: an open-world crime game. Walk with WASD, steal cars with E, outrun the police, run missions for Mara."></canvas>
<div id="hud">
  <div id="hud-top" class="panel">
    <div id="hud-cash">$0</div>
    <div id="hud-mission">Free roam</div>
    <div id="hud-rank"></div>
    <div id="hud-timer"></div>
  </div>
  <div id="wanted">
    <div id="wanted-stars">☆☆☆☆☆</div>
    <div id="wanted-label">Clean</div>
  </div>
  <div id="health-wrap"><div id="health-fill"></div></div>
  <div id="health-label">HEALTH</div>
  <canvas id="minimap" width="220" height="150"></canvas>
  <div id="speed"></div>
  <div id="hint"></div>
  <div id="toast"></div>
</div>
<div id="panel"><div id="panel-box">
  <h1 id="panel-title">VICE BAY</h1>
  <div id="panel-lines"></div>
  <p id="panel-prompt"></p>
</div></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
